[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadow_hand"]

[tool.hatch.build.targets.sdist]
include = ["shadow_hand", "tests", "README.md", "pyproject.toml"]

[project]
name = "shadow-hand"
version = "0.1.0"
description = "Train a 24-DOF Shadow Hand for contact-rich manipulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "imageio[ffmpeg]>=2.37.3",
    "mujoco>=3.6.0",
    "stable-baselines3[extra]>=2.7.1",
    "torch",
    "wandb>=0.25.1",
]

[project.scripts]
shadow-hand = "shadow_hand.cli:main"

[project.optional-dependencies]
mjx = [
    "mujoco-mjx>=3.7.0",
    "sbx-rl>=0.25.0",
    # jax 0.5.x bundles cuDNN 9.8, which needs driver >= 575
    "jax[cuda12]>=0.4.30,<0.5.0",
    "flax>=0.9.0",
    "optax>=0.2.3",
    "chex>=0.1.86",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
name = "pytorch-cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.3",
    "ruff>=0.11",
    "vulture>=2.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PIE", "PERF", "RUF"]
ignore = ["E501", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["shadow_hand"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mujoco.*", "stable_baselines3.*", "wandb.*", "gymnasium.*", "imageio.*", "jax.*", "jaxlib.*", "flax.*", "optax.*", "chex.*", "sbx.*", "mujoco.mjx.*", "tensorflow_probability", "tensorflow_probability.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests requiring MuJoCo environments",
    "grasp: grasp-task tests (shared foundation tests included)",
    "peg: peg-task tests (shared foundation tests included)",
    "pickplace: pick-and-place-task tests (shared foundation tests included)",
]

[tool.vulture]
paths = ["shadow_hand"]
min_confidence = 60
ignore_names = [
    "set_curriculum_params",
    "_on_step",
    "_on_rollout_end",
    "_on_training_start",
    "step_async",
    "step_wait",
    "env_is_wrapped",
    "env_method",
    "get_attr",
    "set_attr",
    "seed",
    "close",
    "get_std",
    "max_num_choices",
    "split_indices",
    "training",
    "min_learning_rate",
    "kl_margin",
    "timestep",
    "gravity",
    "cone",
    "impratio",
    "iterations",
    "integrator",
    "extent",
    "center",
    "quat",
    "maxhullvert",
    "uservert",
    "mocap",
    "__qualname__",
]
ignore_decorators = ["@pytest.fixture", "@abstractmethod"]
